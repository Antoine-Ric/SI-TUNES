name: Validate playlist MVP
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests and executable build
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Frontend install, lint, tests, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests against HTTP fixtures
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
